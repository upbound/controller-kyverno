name: CI

on:
  push:
    branches:
      - 'main'
      - 'release-*'
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
  pull_request: {}
  workflow_dispatch: {}

env:
  UP_API_TOKEN: ${{ secrets.UP_API_TOKEN }}
  UP_ROBOT_ID: ${{ secrets.UP_ROBOT_ID }}
  UP_ORG: ${{ secrets.UP_ORG }}

jobs:
  # This branch doesn't mirror upstream images: it rebuilds Kyverno from the
  # upstream release tag (see README "Patch builds" and .chart-attributes).
  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load build attributes
        id: tag
        run: |
          source .chart-attributes
          echo "GO_VERSION=$GO_VERSION" >> "$GITHUB_ENV"
          # PR builds get a commit suffix, so a release tag is only ever pushed
          # from the release branch, and never twice.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "image-tag=${IMAGE_TAG}-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          else
            echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install crane
        uses: imjasonh/setup-crane@v0.1

      - name: Login to xpkg with robot
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: xpkg.upbound.io
          username: ${{ env.UP_ROBOT_ID }}
          password: ${{ env.UP_API_TOKEN }}

      - name: Build and push images
        if: env.UP_API_TOKEN != ''
        run: bash hack/build-images.sh "${{ steps.tag.outputs.image-tag }}"

      - name: Check images (Go version, CA bundle, base image)
        if: env.UP_API_TOKEN != ''
        run: bash hack/check-images.sh "${{ steps.tag.outputs.image-tag }}"

  publish-image:
    name: Publish Image
    needs: build-images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package-type: [controller, addon]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install up
        uses: upbound/action-up@v1
        with:
          skip-login: true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.22.1'

      - name: Install yq
        uses: dcarbone/install-yq-action@v1
        with:
          version: v4.35.1

      - name: Install crane
        uses: imjasonh/setup-crane@v0.1

      - name: Login to xpkg with robot
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: xpkg.upbound.io
          username: ${{ env.UP_ROBOT_ID }}
          password: ${{ env.UP_API_TOKEN }}

      - name: Create working directory
        run: |
          mkdir -p ${{ matrix.package-type }}-package
          cd ${{ matrix.package-type }}-package

      - name: Build and Publish
        working-directory: ${{ matrix.package-type }}-package
        if: env.UP_API_TOKEN != ''
        env:
          BUILD_IMAGE_TAG: ${{ needs.build-images.outputs.image-tag }}
        run: |
          # Load chart attributes
          source ../.chart-attributes
          cp ../${{ matrix.package-type }}.yaml crossplane.yaml

          # PR builds point the package at the PR's images.
          if [[ "$BUILD_IMAGE_TAG" != "$IMAGE_TAG" ]]; then
            sed -i "s/tag: ${IMAGE_TAG}\$/tag: ${BUILD_IMAGE_TAG}/" crossplane.yaml
          fi
          if [[ "$(yq '[.. | select(has("tag")) | .tag] | unique | join(" ")' crossplane.yaml)" != "$BUILD_IMAGE_TAG" ]]; then
            echo "crossplane.yaml image tags don't all match $BUILD_IMAGE_TAG" >&2
            yq '.. | select(has("tag")) | .tag' crossplane.yaml >&2
            exit 1
          fi

          echo "Using CHART_VERSION: $CHART_VERSION, PACKAGE_VERSION: $PACKAGE_VERSION"

          # Pull the chart
          helm pull $CHART_NAME --repo $REPO_URL --version $CHART_VERSION

          # Build resources
          mkdir helm
          mv $CHART_NAME-$CHART_VERSION.tgz helm/chart.tgz
          mkdir crds
          helm template $RELEASE_NAME helm/chart.tgz -n $RELEASE_NAME --include-crds --kube-version=1.25.0 | \
            yq e 'select(.kind == "CustomResourceDefinition")' - | \
            yq -s '("crds/" + .metadata.name + ".yaml")' -

          # List the structure for verification
          find . -type f | sort

          # Build artifact
          up xpkg build

          # Find artifact
          XPKG_FILENAME=$(find . -name "*.xpkg" -type f -printf "%f\n")

          # Publish artifact
          if [[ "${{ matrix.package-type }}" == "addon" ]]; then
            export CONTROLLER_NAME=$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/.*\///' | sed 's/controller/addon/')
          else
            export CONTROLLER_NAME=$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/.*\///')
          fi

          # Detect if running in a PR context
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            COMMIT_ID=$(echo "$GITHUB_SHA" | cut -c1-7)
            PACKAGE_VERSION="${PACKAGE_VERSION}-${COMMIT_ID}"
          fi

          echo "UP_ORG=$UP_ORG" >> $GITHUB_ENV
          echo "CONTROLLER_NAME=$CONTROLLER_NAME" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

          up xpkg push xpkg.upbound.io/$UP_ORG/$CONTROLLER_NAME:$PACKAGE_VERSION -f $XPKG_FILENAME

      - name: Append package assets for Marketplace
        if: env.UP_API_TOKEN != ''
        run: |
          extensions_dir=${{ github.workspace }}/extensions
          mkdir -p $extensions_dir/readme
          cp ./README.md $extensions_dir/readme/readme.md
          up alpha xpkg append xpkg.upbound.io/${{ env.UP_ORG }}/${{ env.CONTROLLER_NAME }}:${{ env.PACKAGE_VERSION }} --extensions-root $extensions_dir

  run-e2e-tests:
    name: Run e2e Tests
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and login with up
        if: env.UP_API_TOKEN != '' && env.UP_ORG != ''
        uses: upbound/action-up@v1
        with:
          api-token: ${{ secrets.UP_API_TOKEN }}
          organization: ${{ secrets.UP_ORG }}

      - name: Login to xpkg with robot
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: xpkg.upbound.io
          username: ${{ env.UP_ROBOT_ID }}
          password: ${{ env.UP_API_TOKEN }}

      - name: Build project
        run: up project build

      - name: Run e2e tests
        if: env.UP_API_TOKEN != '' && env.UP_ORG != ''
        run: |
          # Attributes
          source .chart-attributes

          # Detect if running in a PR context
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            COMMIT_ID=$(echo "$GITHUB_SHA" | cut -c1-7)
            PACKAGE_VERSION="${PACKAGE_VERSION}-${COMMIT_ID}"
          fi

          UP_CHART_VERSION=$PACKAGE_VERSION up test run tests/* --e2e --local
